# Render.com Blueprint — one-click deploy of the KoreaAPI agent endpoint as a web service.
# (Other hosts — Railway / Fly / Cloud Run — use the Dockerfile directly.)
# Once live, ONE URL carries both protocols:
#   REST      https://<your-service>.onrender.com/            (catalog; spec at /openapi.json)
#   MCP       https://<your-service>.onrender.com/mcp         (Streamable HTTP — any MCP client)
#   manifest  https://<your-service>.onrender.com/.well-known/agent.json
# That manifest URL is what an agent platform / marketplace listing should point at.
services:
  - type: web
    name: koreaapi
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: KOREAAPI_DATA_URL
        value: https://aiagentlabs.co.kr/latest.json
      # To TURN ON x402 payments, set a receiving wallet + mainnet (otherwise the premium endpoint
      # is served free / dormant):
      # - key: X402_PAY_TO
      #   value: "0xYourWalletAddress"
      # - key: X402_NETWORK
      #   value: base
