# Public GEO site (answer-engine-crawlable) on GitHub Pages — builds the FULL koreaapi surface
# (report homepage + per-entity answer pages + vertical hubs + /ko + agents.json + feeds + sitemap)
# from LIVE data, in working-directory koreaapi. Deploys to GitHub Pages (aiagentlabs.co.kr).
#
# ONE-TIME ENABLE: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: pages

on:
  workflow_dispatch: {}
  push:
    branches: [claude/eager-knuth-Vnzca, claude/deploy-vercel-DwbJL]
    paths:
      - "koreaapi/**"
      - "dcmap-web/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "37 1 * * *" # daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python env)
        uses: astral-sh/setup-uv@v5

      - name: Build the public GEO site from live data
        working-directory: koreaapi
        env:
          PYTHONPATH: src
          KOREAAPI_DB: ${{ runner.temp }}/koreaapi.db
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # romanization + Circle Chart extract (best-effort; skipped if unset)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # official-channel release snapshots (best-effort; skipped if unset)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }} # 3rd-source cross-check for drama/film/animation (skipped if unset)
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }} # KTO official place-authority source + badge (skipped if unset)
        run: |
          uv sync
          uv pip install opentimestamps-client || echo "ots install skipped — Bitcoin anchoring stays dormant"
          uv run python -m koreaapi.admin pull
          uv run python -m koreaapi.admin sweep
          uv run python -m koreaapi.admin chart
          uv run python -m koreaapi.admin youtube
          uv run python -m koreaapi.admin report
          uv run python -m koreaapi.admin entitypages
          uv run python -m koreaapi.admin digest
          uv run python -m koreaapi.admin llms
          uv run python -m koreaapi.admin llmsfull
          uv run python -m koreaapi.admin feed
          uv run python -m koreaapi.admin reconcile
          uv run python -m koreaapi.admin status
          uv run python -m koreaapi.admin monitor
          uv run python -m koreaapi.admin export
          mkdir -p ../_site
          cp report.html ../_site/index.html
          cp monitor.html ../_site/monitor.html   # human data-quality cockpit at /monitor.html
          cp llms.txt ../_site/llms.txt   # agent-discoverable at /llms.txt (AEO/GEO)
          cp llms-full.txt ../_site/llms-full.txt   # full LLM-ingestible corpus
          cp reconcile.json ../_site/reconcile.json   # reconciliation index (name/external-ID -> canonical entity)
          cp status.json ../_site/status.json   # health/freshness snapshot
          cp feed.xml ../_site/feed.xml   # RSS freshness feed
          cp feed.json ../_site/feed.json   # JSON Feed
          cp data/korea-rising.md ../_site/korea-rising.md   # shareable verified digest
          cp data/latest.json ../_site/latest.json   # open machine-readable verified data
          cp data/openapi.json ../_site/openapi.json   # OpenAPI 3.1 spec
          cp data/changes.json ../_site/changes.json   # verified change feed (freshness)
          cp data/certified.json ../_site/certified.json   # official rights-holder certification registry
          cp data/integrity.json ../_site/integrity.json   # tamper-evident dataset hash + history chain head
          cp data/integrity-log.jsonl ../_site/integrity-log.jsonl   # public append-only attestation log
          cp data/integrity-head.txt* ../_site/ 2>/dev/null || true   # OpenTimestamps proof (only when anchoring enabled)
          cp robots.txt ../_site/robots.txt   # welcome answer-engine crawlers (AEO)
          cp CNAME ../_site/CNAME   # bind the custom domain (aiagentlabs.co.kr)
          cp googleb476fa8c4c3cccf0.html ../_site/   # Google Search Console verification
          cp -r site/artist ../_site/artist   # per-entity citable answer pages (/artist/<slug>.html)
          cp -r site/badge ../_site/badge   # embeddable "Verified by KoreaAPI" SVG badges
          cp -r site/ko ../_site/ko   # Korean-led answer pages + /ko/ home (hreflang)
          cp site/methodology.html site/for-agents.html site/agents.json site/pricing.html site/certify.html ../_site/   # trust + quickstart + manifest + pricing + certify
          cp -r site/person ../_site/person   # per-person credit pages
          cp -r site/label ../_site/label   # per-label/agency/network hub pages
          cp site/*.html ../_site/   # every generated top-level hub + standalone page (glob — no per-vertical list)
          uv run python -m koreaapi.admin sitemap   # sitemap.xml incl. every entity + person page
          cp sitemap.xml ../_site/sitemap.xml

      # 명당 AI 데이터센터 맵 — 같은 Pages 사이트의 /map/ 하위경로에 얹는다 (임시 프리뷰).
      # continue-on-error: 맵 빌드가 실패해도 koreaapi GEO 사이트 배포는 그대로 진행.
      - name: Set up Node (dcmap-web)
        uses: actions/setup-node@v4
        with:
          node-version: 20
        continue-on-error: true
      - name: Build dcmap-web → _site/map
        continue-on-error: true
        working-directory: dcmap-web
        env:
          VITE_BASE: /map/
          VITE_SITE_ORIGIN: https://aiagentlabs.co.kr/map
        run: |
          npm ci || npm install
          npm run build
          mkdir -p ../_site/map
          cp -r dist/* ../_site/map/
          cp dist/index.html ../_site/map/404.html   # /map/ 하위 SPA 폴백(비프리렌더 클라이언트 라우트)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3 # publishes ./_site by default
      - id: deploy
        uses: actions/deploy-pages@v4
