# Public GEO page (answer-engine-crawlable) on GitHub Pages.
#
# Builds report.html from LIVE data (pull runs on GitHub's open-network runner) and deploys
# it to GitHub Pages — a free, public, JSON-LD-bearing URL that Perplexity / ChatGPT / Google
# AI Overviews can crawl and cite. This is the GEO substrate's public surface.
#
# ONE-TIME ENABLE: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Then: Actions -> "pages" -> Run workflow (manual now; the daily schedule activates once this
# file is on the default branch). Live URL appears in the run summary + Settings -> Pages.
#
# NON-DEFAULT BRANCH: deploying from a feature branch also needs it allowed in the github-pages
# environment, else the deploy is blocked at the environment gate (instant ~2s failure, no logs):
#   Settings -> Environments -> github-pages -> Deployment branches and tags -> No restriction
#   (or add this branch). Once merged to the default branch this is unnecessary.
name: pages

on:
  workflow_dispatch: {}
  push:
    # feature branch (now) + the default branch (so the page still rebuilds on push after PR #1 merges)
    branches: [claude/eager-knuth-Vnzca, claude/deploy-vercel-DwbJL]
    paths:
      - "koreaapi/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "37 1 * * *" # daily, after the collect job

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python env)
        uses: astral-sh/setup-uv@v5

      - name: Build the public GEO page from live data
        working-directory: koreaapi
        env:
          PYTHONPATH: src
          KOREAAPI_DB: ${{ runner.temp }}/koreaapi.db
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # romanization + Circle Chart extract (best-effort; skipped if unset)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # official-channel release snapshots (best-effort; skipped if unset)
        run: |
          uv sync
          uv run python -m koreaapi.admin pull
          uv run python -m koreaapi.admin sweep
          uv run python -m koreaapi.admin chart
          uv run python -m koreaapi.admin youtube
          uv run python -m koreaapi.admin report
          uv run python -m koreaapi.admin digest
          uv run python -m koreaapi.admin monitor
          uv run python -m koreaapi.admin export
          mkdir -p ../_site
          cp report.html ../_site/index.html
          cp monitor.html ../_site/monitor.html   # human data-quality cockpit at /monitor.html
          cp llms.txt ../_site/llms.txt   # agent-discoverable at /llms.txt (AEO/GEO)
          cp data/korea-rising.md ../_site/korea-rising.md   # shareable verified digest at /korea-rising.md
          cp data/latest.json ../_site/latest.json   # open machine-readable verified data at /latest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3 # publishes ./_site by default
      - id: deploy
        uses: actions/deploy-pages@v4
