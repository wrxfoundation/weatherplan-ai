# 제휴사 차량 이미지 자동 갱신
#
# 하는 일: 목록 페이지에서 매핑을 다시 뽑고(차종 추가·삭제 반영),
#          바뀐 이미지만 내려받아(조건부 요청) 배포한다.
#
# 켜기 전 준비 2가지:
#   1) moduon/scripts/car-sources.txt 에 제조사별 목록 페이지 URL 을 채운다.
#      비어 있으면 이 워크플로는 아무것도 하지 않고 끝난다.
#   2) 배포까지 자동으로 하려면 리포지토리 Secrets 에 VERCEL_TOKEN 을 넣는다.
#      없으면 매핑 변경만 커밋하고 배포는 건너뛴다(사람이 직접 배포).
name: 차량 이미지 자동 갱신

on:
  schedule:
    - cron: '0 18 * * 0'   # UTC 일 18:00 = 한국시간 월요일 오전 3시
  workflow_dispatch:        # 수동 실행

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moduon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moduon/package-lock.json

      - name: 목록 URL 이 있는지 확인
        id: sources
        run: |
          if grep -qE '^\s*https?://' scripts/car-sources.txt; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scripts/car-sources.txt 가 비어 있어 갱신을 건너뜁니다."
          fi

      - run: npm ci
        if: steps.sources.outputs.has == 'true'

      - name: 매핑 갱신 (차종 추가·삭제 반영)
        if: steps.sources.outputs.has == 'true'
        run: node scripts/map-car-images.mjs

      - name: 이미지 갱신 (바뀐 것만)
        if: steps.sources.outputs.has == 'true'
        run: node scripts/fetch-car-images.mjs

      - name: 매핑이 바뀌었으면 커밋
        if: steps.sources.outputs.has == 'true'
        id: commit
        run: |
          if git diff --quiet -- src/lib/cars.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::매핑 변경 없음."
          else
            git config user.name  "moduon-bot"
            git config user.email "noreply@github.com"
            git add src/lib/cars.js
            git commit -m "차량 이미지 매핑 자동 갱신"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 이미지는 gitignore 라 리포에 남지 않는다 — 여기서 빌드해 배포해야 사이트에 반영된다.
      - name: 배포 (VERCEL_TOKEN 이 있을 때만)
        if: steps.sources.outputs.has == 'true' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: 배포를 건너뛴 경우 안내
        if: steps.sources.outputs.has == 'true' && env.VERCEL_TOKEN == ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "::notice::VERCEL_TOKEN 이 없어 배포를 건너뜁니다. 로컬에서 npm run deploy 를 실행하세요."
