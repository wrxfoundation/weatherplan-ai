# Chronicle #4 청약·분양가 박제 (bunyang-capsule) — 스펙 v4의 첫 어댑터 (chronicle/PLAN.md).
#
# 일 1회 청약홈 분양정보를 수집해 diff를 해시체인에 봉인하고, 변경이 있을 때만
# data/를 커밋한다 (변경 없는 날은 엔진이 파일을 하나도 쓰지 않는다).
# 요구 Secret: DATA_GO_KR_KEY (data.go.kr "한국부동산원_청약홈 분양정보 조회 서비스" 디코딩 키).
# Manual: Actions tab -> "bunyang" -> Run workflow.
# The daily schedule activates once this file is on the repo's default branch.
name: bunyang

on:
  workflow_dispatch: {}
  schedule:
    - cron: "47 21 * * *" # daily ~06:47 KST — 전일 갱신분 수집

permissions:
  contents: write

concurrency:
  group: chronicle-bunyang
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: chronicle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chronicle/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Collect + seal (변경 없으면 아무것도 쓰지 않음)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npm run collect -- bunyang-capsule

      - name: Verify hash chain
        run: npm run verify -- bunyang-capsule

      - name: Commit accumulated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data(bunyang-capsule): daily capsule [skip ci]"
            # 같은 브랜치에 다른 봇(koreaapi collect 등)이 밀어넣는 push와 경합할 수
            # 있어 rebase 후 재시도한다. 끝내 실패하면 그날 캡슐 유실이므로 잡을 실패시킨다.
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "push failed after $n attempts" >&2; exit 1; fi
              git pull --rebase origin "$GITHUB_REF_NAME"
            done
          fi
