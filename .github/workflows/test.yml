# koreaapi CI — run the test suite + linter on every push (the suite was running nowhere automated).
# On GitHub's open-network runners the live smoke tests actually exercise Wikidata/Wikipedia
# (they auto-skip only on transient network failure), so this gates both offline correctness
# and the live adapters.
name: test

on:
  workflow_dispatch: {}
  push:
    branches: [claude/eager-knuth-Vnzca]
    paths:
      - "koreaapi/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "koreaapi/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koreaapi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q
