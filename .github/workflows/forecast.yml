# Chronicle #11 기관 전망 박제 (forecast-graders) — 모노리포용 (chronicle/ 서브트리).
# standalone 리포에는 chronicle/.github/workflows/forecast.yml이 동일 역할을 한다.
# The schedule activates once this file is on the repo's default branch.
name: forecast

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 21 * * 0,3" # 월·목 ~06:17 KST (UTC 일·수 21:17)

permissions:
  contents: write

concurrency:
  group: chronicle-cron # 전 수집 크론 직렬화 — docs 동시 재생성 경합 방지
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chronicle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chronicle/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Collect + seal (변경 없으면 아무것도 쓰지 않음)
        run: npm run collect -- forecast-graders

      - name: Verify hash chain
        run: npm run verify -- forecast-graders

      - name: Anchor chain head to RFC 3161 TSA (best-effort)
        run: npm run anchor -- forecast-graders

      - name: Publish site (docs/)
        run: |
          npm run site
          test -f docs/index.html && test -f docs/.nojekyll  # 산출물 없으면 여기서 실패

      - name: Commit accumulated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data(forecast-graders): forecast capsule [skip ci]"
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "push failed after $n attempts" >&2; exit 1; fi
              git pull --rebase origin "$GITHUB_REF_NAME"
            done
          fi
