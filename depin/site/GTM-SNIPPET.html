     [ ] ( ) 마크다운 문법이 코드 안에 끼어들어 스크립트가 깨진다.
     (실제 사고 사례: j.src='...gtm.js?id=['+i+dl;...)](https://...) )
     깨진 채 붙이면 화면에 오류 표시 없이 GTM 이 아예 로드되지 않는다.

  ── 붙이는 위치 ─────────────────────────────
  [1] <head> 안, 가능한 한 위 (<meta charset> 바로 다음 권장)
  [2] <body> 여는 태그 바로 뒤, body 안의 첫 줄
  정적/SPA 사이트면 index.html 한 곳이 모든 라우트의 진입점이므로
  한 번만 넣으면 전체가 커버된다.

  ── 붙인 뒤 반드시 할 것 ────────────────────
  1) GTM → 태그 → 새로 만들기 → "Google 애널리틱스: GA4 구성"
     측정 ID G-XXXXXXXXXX (GA4 → 관리 → 데이터 스트림에서 확인)
     트리거 All Pages
  2) 오른쪽 위 [제출] → [게시]
     ★ 게시를 누르지 않으면 스니펫을 붙여도 데이터가 한 건도 안 간다.
  3) 확인: GA4 → 보고서 → 실시간 에서 본인 접속이 잡히는지.
     안 잡히면 브라우저 개발자도구 Network 탭에서 gtm.js 요청 여부 확인.

  ── 이 스니펫이 하지 않는 것 ────────────────
  · UTM 은 만들어 주지 않는다. 공유 링크에 직접 붙여야 한다.
    ?utm_source=telegram|x|tg_<KOL핸들>&utm_medium=owned|kol&utm_campaign=prereg0907
    UTM 없이 나간 링크의 채널 귀속은 영구히 복구할 수 없다.
  · KOL 정산 근거로 쓸 수 없다. GA4 어트리뷰션은 쿠키 기반이라
    기기 변경·쿠키 삭제에 끊기고 9/7 예약 → 9/15 결제 연결에 취약하다.
    예약 시점에 utm_source 를 예약 레코드에 서버 저장할 것.
    (GA = 마케팅 관찰용 / 정산 = 우리 DB)
