<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>KBW2026 프로그램</title>
<style>
/* KBW2026 프로그램 — 행사 소개 · 시간순 세션 · 연사 소속 한 줄. 서체 · 색 토큰은 본 페이지와 같다. */
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920; font-style: normal; font-display: swap;
  src: url("fonts/PretendardVariable.woff2") format("woff2-variations"),
       url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
}
:root {
  --bg: #f4f5f9; --surface: #ffffff; --surface-2: #f8f8fc;
  --ink: #16163f; --ink-2: #3d3d66; --muted: #6f6f90; --faint: #a3a3bc;
  --line: #e4e5ef; --line-2: #d3d4e3;
  --accent: #4d4dce; --accent-ink: #3a3ab8; --accent-bg: #eeeefb;
  --shadow: 0 1px 2px rgba(22, 22, 63, .05), 0 2px 8px rgba(22, 22, 63, .04);
  --r: 14px; --r-sm: 9px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1020; --surface: #181a2e; --surface-2: #1d1f35;
    --ink: #ececf8; --ink-2: #c5c5e0; --muted: #9a9abb; --faint: #6c6c8c;
    --line: #2a2c45; --line-2: #3a3c5a;
    --accent: #a5a5ff; --accent-ink: #c2c2ff; --accent-bg: #25264c;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1020; --surface: #181a2e; --surface-2: #1d1f35;
  --ink: #ececf8; --ink-2: #c5c5e0; --muted: #9a9abb; --faint: #6c6c8c;
  --line: #2a2c45; --line-2: #3a3c5a;
  --accent: #a5a5ff; --accent-ink: #c2c2ff; --accent-bg: #25264c;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 14.5px; line-height: 1.6; letter-spacing: -0.003em;
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
input { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
.lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* 머리 */
.top { padding-top: 32px; padding-bottom: 8px; }
.top .lbl { color: var(--accent); }
.top h1 { font-size: 30px; line-height: 1.22; font-weight: 800; letter-spacing: -0.025em; margin: 8px 0 8px; text-wrap: balance; }
.top .lead { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 62ch; }
.site { margin: 12px 0 0; font-size: 13px; font-weight: 600; }
.site a { text-decoration: none; }
.site a:hover { text-decoration: underline; }

/* 어떤 행사 */
.about { padding: 16px 18px; margin: 18px 0 0; }
.about dl { margin: 0; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px 14px; font-size: 14px; }
.about dt { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 2px; }
.about dd { margin: 0; color: var(--ink); }
.about dd small { color: var(--muted); font-size: 12.5px; }

/* 날짜 이동 · 검색 */
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-top: 18px; }
.bar .wrap { display: flex; gap: 8px; align-items: center; padding-top: 10px; padding-bottom: 10px; }
.days { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; flex: none; }
.days a { text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: 13.5px; padding: 7px 12px; border-radius: 9px; white-space: nowrap; }
.days a:hover { background: var(--accent-bg); color: var(--accent-ink); }
.days a small { font-weight: 600; color: var(--muted); margin-left: 4px; }
.search { position: relative; flex: 1; min-width: 0; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
.search input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--line-2); border-radius: 11px; background: var(--surface); font-size: 14.5px; }
.search input::placeholder { color: var(--faint); }
.count { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

/* 프로그램 */
main.wrap { padding-top: 6px; padding-bottom: 44px; }
.day { scroll-margin-top: 70px; }
.day h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin: 26px 0 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.day h2 small { font-size: 13px; font-weight: 600; color: var(--muted); }
.list { display: grid; gap: 10px; }
.sess { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 14px; padding: 14px 16px; }
.sess .time { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.35; }
.sess .time span { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.sess h3 { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.42; letter-spacing: -0.008em; }
.sess .none { color: var(--faint); font-size: 13px; margin: 8px 0 0; }
ul.sp { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
.sp li { display: grid; grid-template-columns: minmax(160px, 230px) minmax(0, 1fr); gap: 2px 18px; padding: 7px 0; border-top: 1px solid var(--line); }
.sp li:first-child { border-top: 0; }
.sp .nm { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.sp .en { display: block; font-size: 12px; color: var(--muted); }
.sp .mod { display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; line-height: 17px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
.sp .org { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.sp .org .est { font-size: 11px; color: var(--faint); margin-left: 5px; }
.sp .co { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.brk { font-size: 13px; color: var(--muted); padding: 8px 16px; border: 1px dashed var(--line-2); border-radius: var(--r-sm); text-align: center; }
.empty { color: var(--muted); text-align: center; padding: 30px 0; }
mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

footer { color: var(--muted); font-size: 12.5px; padding: 18px 20px 44px; border-top: 1px solid var(--line); }
footer p { margin: 4px 0; }

@media (max-width: 640px) {
  .wrap { padding-left: 16px; padding-right: 16px; }
  .top { padding-top: 18px; }
  .top h1 { font-size: 23px; margin: 6px 0 4px; }
  .top .lead { font-size: 13.5px; }
  .about { padding: 14px; }
  .about dl { grid-template-columns: 56px minmax(0, 1fr); gap: 7px 10px; font-size: 13.5px; }
  .bar .wrap { flex-wrap: wrap; }
  .days { width: 100%; } .days a { flex: 1; text-align: center; padding: 7px 6px; }
  .count { display: none; }
  .sess { grid-template-columns: 52px minmax(0, 1fr); padding: 13px 14px; gap: 4px 10px; }
  .sess .time { font-size: 14px; }
  .sess h3 { font-size: 15px; }
  .sp li { grid-template-columns: minmax(0, 1fr); gap: 1px; }
  .sp .en { display: inline; margin-left: 6px; }
}
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; font-size: 11.5px; }
  .bar, .site { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .panel { box-shadow: none; }
  .sess { break-inside: avoid; padding: 8px 10px; }
  .day h2 { break-after: avoid; }
}
</style>
</head>
<body>
<header class="top wrap">
  <span class="lbl">KBW2026 · <span id="upd" class="num"></span> 공개 아젠다 기준</span>
  <h1>KBW2026 프로그램</h1>
  <p class="lead">Korea Blockchain Week 2026 본 컨퍼런스 이틀의 세션을 시간순으로 적고, 연사는 소속 · 직함 한 줄로 소개한다.</p>
  <p class="site"><a href="index.html">XRP SEOUL 2026(10/3) 연사 지도 →</a></p>
</header>
<div class="wrap"><section class="about panel" aria-label="어떤 행사"><dl id="facts"></dl></section></div>
<nav class="bar" aria-label="날짜 · 검색">
  <div class="wrap">
    <div class="days" id="days"></div>
    <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="10.8" y1="10.8" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input type="search" id="q" placeholder="연사 · 회사 · 세션 검색" aria-label="연사 · 회사 · 세션 검색"></label>
    <span class="count num" id="count"></span>
  </div>
</nav>
<main class="wrap" id="prog"></main>
<footer class="wrap" id="foot"></footer>
<script>
const D = /*__KBW__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hi = (text, words) => {
  let h = esc(text);
  for (const w of words) { if (w.length < 2) continue; h = h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`); }
  return h;
};
const hay = (s) => [s.title, ...s.sp.flatMap((x) => { const p = D.people[x.p]; return [p.name, p.ko, p.org, p.co]; })].join(" ").toLowerCase();

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  let shown = 0, html = "";
  for (const d of D.days) {
    const all = D.sessions.filter((s) => s.day === d.id);
    const list = all.filter((s) => s.kind === "break" ? !words.length : words.every((w) => hay(s).includes(w)));
    const n = list.filter((s) => s.kind !== "break").length;
    shown += n;
    html += `<section class="day" id="${d.id}"><h2>${esc(d.label)} · ${esc(d.nth)}<small class="num">세션 ${words.length ? `${n} / ` : ""}${all.filter((s) => s.kind !== "break").length}</small></h2><div class="list">`;
    for (const s of list) {
      if (s.kind === "break") { html += `<div class="brk">${esc(s.start)}–${esc(s.end)} · ${esc(s.title)}</div>`; continue; }
      const sp = s.sp.length ? `<ul class="sp">${s.sp.map((x) => {
        const p = D.people[x.p];
        const nm = p.ko || p.name;
        return `<li><div><span class="nm">${hi(nm, words)}</span>${x.mod ? `<span class="mod">모더레이터</span>` : ""}${p.ko ? `<span class="en">${hi(p.name, words)}</span>` : ""}</div>
          <div>${p.org ? `<p class="org">${hi(p.org, words)}${p.est ? `<span class="est">추정</span>` : ""}</p>` : ""}${p.co ? `<p class="co">${hi(p.co, words)}</p>` : ""}</div></li>`;
      }).join("")}</ul>` : `<p class="none">연사 표기 없음</p>`;
      html += `<article class="sess panel"><div class="time">${esc(s.start)}${s.end ? `<span>${esc(s.end)}</span>` : ""}</div><div><h3>${hi(s.title, words)}</h3>${sp}</div></article>`;
    }
    if (!list.length) html += `<p class="empty">이 날에는 찾는 세션이 없습니다.</p>`;
    html += `</div></section>`;
  }
  $("#prog").innerHTML = html;
  $("#count").textContent = words.length ? `${shown}개 세션` : `세션 ${D.sessions.filter((s) => s.kind !== "break").length} · 연사 ${Object.keys(D.people).length}`;
}

$("#upd").textContent = D.asof;
$("#facts").innerHTML = D.facts.map(([k, v, s]) => `<dt>${esc(k)}</dt><dd>${esc(v)}${s ? ` <small>${esc(s)}</small>` : ""}</dd>`).join("");
$("#days").innerHTML = D.days.map((d) => `<a href="#${d.id}">${esc(d.label)}<small class="num">${D.sessions.filter((s) => s.day === d.id && s.kind !== "break").length}</small></a>`).join("");
$("#foot").innerHTML = D.foot.map((f) => `<p>${esc(f)}</p>`).join("");
$("#q").addEventListener("input", render);
render();
</script>
</body>
</html>
