<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><title>Warehouse or Shelf</title>
<style>
@font-face{font-family:'Pretendard';src:url('assets/PretendardVariable.woff2') format('woff2');font-weight:100 900}
:root{--ink:#0E0E1A;--accent:#4A3AF0;--mutedL:rgba(255,255,255,.66);--mutedR:#5E5D78}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#0b0b10;font-family:{{font}};-webkit-font-smoothing:antialiased;overflow:hidden}
html[lang=ko] body{word-break:keep-all}
.half{position:absolute;top:0;width:960px;height:1080px;overflow:hidden}
.L{left:0;background:url('assets/farm-ai-2.jpg') center 30%/cover;color:#fff}
.L .c{text-shadow:0 2px 14px rgba(0,0,0,.55)}
.L .rows{text-shadow:none}
.R{left:960px;background:url('assets/room-ai.jpg') center/cover;color:var(--ink)}
.L::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,7,12,.82) 0%,rgba(6,7,12,.55) 26%,rgba(6,7,12,.38) 46%,rgba(6,7,12,.45) 70%,rgba(6,7,12,.7) 100%)}
.R::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.22) 34%,rgba(255,255,255,0) 52%)}
.c{position:absolute;inset:0;padding:58px 84px 0}
h1{font-size:{{h1size}};font-weight:700;letter-spacing:-0.028em;line-height:1.04}
.R h1{color:var(--accent)}
.tag{position:absolute;left:84px;top:236px;font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.L .tag{color:var(--mutedL)} .R .tag{color:var(--mutedR)}
.power{position:absolute;left:78px;top:258px;font-size:122px;font-weight:700;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}
.R .power{color:var(--accent)}
.pct{display:inline-block;vertical-align:middle;margin-left:26px;transform:translateY(-14px);font-size:30px;font-weight:700;letter-spacing:-0.01em;padding:10px 20px;border-radius:999px;background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(74,58,240,.28)}
.pct:empty{display:none}
.cost{position:absolute;left:84px;right:84px;top:386px;font-size:34px;font-weight:700;letter-spacing:-0.01em;line-height:1.25}
.L .cost b{color:#FF7A59}.R .cost b{color:var(--accent)}
.cost small{display:block;font-size:18px;font-weight:500;margin-top:2px}
.L .cost small{color:var(--mutedL)} .R .cost small{color:var(--mutedR)}
.shadow{position:absolute;left:1232px;top:730px;width:364px;height:34px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(30,22,40,.55) 0%,rgba(30,22,40,.28) 42%,rgba(30,22,40,0) 70%);filter:blur(4px)}
.contact{position:absolute;left:1252px;top:744px;width:330px;height:9px;border-radius:50%;background:rgba(22,16,30,.5);filter:blur(3px)}
.shadow2{position:absolute;left:1190px;top:690px;width:450px;height:100px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(60,48,90,.22) 0%,rgba(60,48,90,0) 70%);filter:blur(14px)}
.dev{position:absolute;left:1196px;top:448px;width:410px;filter:drop-shadow(0 4px 5px rgba(40,30,60,.2))}
.rows{position:absolute;left:66px;right:66px;top:794px;border-radius:22px;padding:10px 22px;backdrop-filter:blur(18px)}
.L .rows{background:rgba(10,10,18,.62);border:1px solid rgba(255,255,255,.12)}
.R .rows{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(60,48,90,.12)}
.row{display:grid;grid-template-columns:128px 1fr;align-items:baseline;padding:6px 0;font-size:24px;font-weight:500;line-height:1.25}
.row+.row{border-top:1px solid}
.L .row+.row{border-color:rgba(255,255,255,.14)} .R .row+.row{border-color:rgba(20,20,40,.1)}
.row span{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.L .row span{color:var(--mutedL)} .R .row span{color:var(--mutedR)}
.row small{font-size:19px;font-weight:500;opacity:.72}
html[lang=ko] .tag,html[lang=ko] .row span{letter-spacing:.02em}
.vs{position:absolute;left:960px;top:540px;transform:translate(-50%,-50%);width:128px;height:128px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Display','Inter',sans-serif;font-size:44px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 10px rgba(255,255,255,.18)}
.seam{position:absolute;left:959px;top:0;width:2px;height:1080px;background:rgba(255,255,255,.55)}
.logo{position:absolute;left:960px;bottom:14px;transform:translateX(-50%);height:50px;padding:0 26px;border-radius:26px;background:rgba(14,14,26,.78);backdrop-filter:blur(14px);display:flex;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.logo img{height:44px;display:block}
</style></head>
<body>
<div class="half L"><div class="c">
  <h1>{{h1a}}<br>{{h1b}}</h1>
  <div class="tag">{{lt}}</div><div class="power">{{lp}}<span class="pct">{{lpct}}</span></div>
  <div class="cost"><b>{{lc}}</b><small>{{lcs}}</small></div>
  <div class="rows">
    <div class="row"><span>{{k1}}</span><div>{{l1}} <small>{{l1s}}</small></div></div>
    <div class="row"><span>{{k2}}</span><div>{{l2}} <small>{{l2s}}</small></div></div>
    <div class="row"><span>{{k3}}</span><div>{{l3}} <small>{{l3s}}</small></div></div>
    <div class="row"><span>{{k4}}</span><div>{{l4}}</div></div>
  </div></div></div>
<div class="half R"><div class="c">
  <h1>{{h2a}}<br>{{h2b}}</h1>
  <div class="tag">{{rt}}</div><div class="power">{{rp}}<span class="pct">{{rpct}}</span></div>
  <div class="cost"><b>{{rc}}</b><small>{{rcs}}</small></div>
  <div class="rows">
    <div class="row"><span>{{k1}}</span><div>{{r1}} <small>{{r1s}}</small></div></div>
    <div class="row"><span>{{k2}}</span><div>{{r2}} <small>{{r2s}}</small></div></div>
    <div class="row"><span>{{k3}}</span><div>{{r3}} <small>{{r3s}}</small></div></div>
    <div class="row"><span>{{k4}}</span><div>{{r4}}</div></div>
  </div></div></div>
<div class="shadow2"></div><div class="shadow"></div><div class="contact"></div>
<img class="dev" src="assets/device-cut-277.png" alt="Wellbian air monitor">
<div class="seam"></div>
<div class="vs">vs</div>
<div class="logo"><img src="assets/wellbian-nav.svg" alt="wellbian"></div>
</body></html>
