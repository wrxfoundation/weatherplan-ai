<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><title>Warehouse or Shelf</title>
<style>
@font-face{font-family:'Pretendard';src:url('assets/PretendardVariable.woff2') format('woff2');font-weight:100 900}
:root{--ink:#0E0E1A;--accent:#4A3AF0;--mutedL:rgba(255,255,255,.62);--mutedR:#6F6E88}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#0b0b10;font-family:{{font}};-webkit-font-smoothing:antialiased;overflow:hidden}
.half{position:absolute;top:0;width:960px;height:1080px;overflow:hidden}
.L{left:0;background:url('assets/farm-ai.jpg') center/cover;color:#fff}
.R{left:960px;background:url('assets/room-ai.jpg') center/cover;color:var(--ink)}
.L::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,7,12,.78) 0%,rgba(6,7,12,.35) 34%,rgba(6,7,12,.35) 58%,rgba(6,7,12,.9) 80%,rgba(6,7,12,.96) 100%)}
.R::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.15) 38%,rgba(255,255,255,0) 60%,rgba(255,255,255,0) 72%,rgba(250,249,255,.86) 80%,rgba(250,249,255,.94) 100%)}
.dev{position:absolute;left:1190px;top:452px;width:420px;filter:drop-shadow(0 26px 22px rgba(40,30,60,.28))}
.c{position:absolute;inset:0;padding:66px 84px 0}
h1{font-size:70px;font-weight:700;letter-spacing:-0.028em;line-height:1.04}
.R h1{color:var(--accent)}
.tag{position:absolute;left:84px;top:268px;font-size:19px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.L .tag{color:var(--mutedL)} .R .tag{color:var(--mutedR)}
.power{position:absolute;left:78px;top:292px;font-size:128px;font-weight:700;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}
.R .power{color:var(--accent)}
.rows{position:absolute;left:84px;right:84px;top:824px}
.row{display:grid;grid-template-columns:132px 1fr;align-items:baseline;padding:8px 0;font-size:25px;font-weight:500;line-height:1.25}
.L .row{border-top:1px solid rgba(255,255,255,.18)} .R .row{border-top:1px solid rgba(20,20,40,.12)}
.row span{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.L .row span{color:var(--mutedL)} .R .row span{color:var(--mutedR)}
.row small{font-size:20px;font-weight:500;opacity:.7}
html[lang=ko] .tag,html[lang=ko] .row span{letter-spacing:.02em}
html[lang=ko] body{word-break:keep-all}
.vs{position:absolute;left:960px;top:540px;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Display','Inter',sans-serif;font-size:46px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 10px rgba(255,255,255,.18)}
.seam{position:absolute;left:959px;top:0;width:2px;height:1080px;background:rgba(255,255,255,.55)}
.foot{position:absolute;left:0;right:0;bottom:0;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 84px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-0.02em;color:var(--ink)}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);position:relative}
.brand i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.note{font-size:12px;color:#8A8AA2;text-align:center;max-width:900px;line-height:1.4;text-wrap:balance}
.sig{font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-0.01em}
</style></head>
<body>
<div class="half L"><div class="c">
  <h1>{{h1a}}<br>{{h1b}}</h1>
  <div class="tag">{{lt}}</div><div class="power">{{lp}}</div>
  <div class="rows">
    <div class="row"><span>{{k1}}</span><div>{{l1}}</div></div>
    <div class="row"><span>{{k2}}</span><div>{{l2}} <small>{{l2s}}</small></div></div>
    <div class="row"><span>{{k3}}</span><div>{{l3}}</div></div>
    <div class="row"><span>{{k4}}</span><div>{{l4}}</div></div>
  </div></div></div>
<div class="half R"><div class="c">
  <h1>{{h2a}}<br>{{h2b}}</h1>
  <div class="tag">{{rt}}</div><div class="power">{{rp}}</div>
  <div class="rows">
    <div class="row"><span>{{k1}}</span><div>{{r1}}</div></div>
    <div class="row"><span>{{k2}}</span><div>{{r2}} <small>{{r2s}}</small></div></div>
    <div class="row"><span>{{k3}}</span><div>{{r3}}</div></div>
    <div class="row"><span>{{k4}}</span><div>{{r4}}</div></div>
  </div></div></div>
<img class="dev" src="assets/device-cut.png" alt="Wellbian air monitor">
<div class="seam"></div>
<div class="vs">vs</div>
<div class="foot"><div class="brand"><i></i>wellbian</div><div class="note">{{note}}</div><div class="sig">{{sig}}</div></div>
</body></html>
